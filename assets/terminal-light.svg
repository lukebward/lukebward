<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="1000" height="348" role="img" aria-label="Terminal session. neofetch: luke at pulumi — role computer scientist; langs go, typescript, python, swift; building speculate, pmox, Ezmoji; uptime since aug 2020; web luke-ward.com.">
  <style>
    .b-t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; }
    .b-an { opacity: 0; }
    .b-cov1 { animation: b-type1 0.7s steps(8, end) 0.4s forwards; }
    .b-art  { animation: b-show 0.01s step-end 1.3s forwards; }
    .b-info { animation: b-show 0.01s step-end 1.45s forwards; }
    .b-pal  { animation: b-show 0.01s step-end 1.6s forwards; }
    .b-l3   { animation: b-show 0.01s step-end 2s forwards; }
    .b-cur  { animation: b-blink 1.1s steps(1, end) infinite; }
    @keyframes b-type1 { to { x: 136px; width: 0px; } }
    @keyframes b-show { to { opacity: 1; } }
    @keyframes b-blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .b-an { animation: none; opacity: 1; }
      .b-cov1 { display: none; }
      .b-cur { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="998" height="346" rx="10" fill="#161b22" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="88" y="29" class="b-t" font-size="13" fill="#6e7681">luke@pulumi:~</text>
  <line x1="1" y1="44" x2="999" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- $ neofetch -->
  <text x="36" y="80" class="b-t" fill="#5EC5A5">$</text>
  <text x="55" y="80" class="b-t" fill="#e6edf3" textLength="77">neofetch</text>
  <rect class="b-cov1" x="55" y="64" width="81" height="22" fill="#161b22"/>

  <!-- neofetch output: ascii mark -->
  <g class="b-an b-art" fill="#5EC5A5">
    <text x="36" y="116" class="b-t">██╗&#160;&#160;&#160;&#160;&#160;&#160;██╗&#160;&#160;&#160;&#160;██╗</text>
    <text x="36" y="140" class="b-t">██║&#160;&#160;&#160;&#160;&#160;&#160;██║&#160;&#160;&#160;&#160;██║</text>
    <text x="36" y="164" class="b-t">██║&#160;&#160;&#160;&#160;&#160;&#160;██║&#160;█╗&#160;██║</text>
    <text x="36" y="188" class="b-t">██║&#160;&#160;&#160;&#160;&#160;&#160;██║███╗██║</text>
