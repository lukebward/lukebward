    <text x="280" y="116" class="b-t" fill="#5EC5A5" font-weight="600">luke@pulumi</text>
    <text x="280" y="140" class="b-t" fill="#6e7681">───────────</text>
    <text x="280" y="164" class="b-t" fill="#5EC5A5">role</text><text x="422" y="164" class="b-t" fill="#e6edf3">computer scientist</text>
    <text x="280" y="188" class="b-t" fill="#5EC5A5">langs</text><text x="422" y="188" class="b-t" fill="#e6edf3">go · typescript · python · swift</text>
    <text x="280" y="212" class="b-t" fill="#5EC5A5">building</text><text x="422" y="212" class="b-t" fill="#e6edf3">speculate · pmox · Ezmoji</text>
    <text x="280" y="236" class="b-t" fill="#5EC5A5">uptime</text><text x="422" y="236" class="b-t" fill="#e6edf3">since aug 2020</text>
    <text x="280" y="260" class="b-t" fill="#5EC5A5">web</text><text x="422" y="260" class="b-t" fill="#e6edf3">luke-ward.com</text>
    <text x="280" y="284" class="b-t" fill="#5EC5A5">theme</text><text x="422" y="284" class="b-t" fill="#9198a1">light — bold choice</text>
  </g>

  <!-- neofetch output: palette -->
  <g class="b-an b-pal">
